[project]
name = "rtx5090-watcher"
version = "1.0.0"
description = "Tiered RTX 5090 stock watcher. TinyFish Fetch first, Agent only when the page will not give up stock."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rtx5090-watch = "rtx5090_watcher.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
